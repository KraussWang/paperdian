name: 功能建议 / Feature request
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: 其他考虑过的方案 / Alternatives
