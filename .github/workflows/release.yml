name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Verify tag matches versions
        run: |
          tag="${GITHUB_REF_NAME}"
          node -e '
            const tag = process.argv[1];
            const manifest = require("./manifest.json");
            const pkg = require("./package.json");
            const versions = require("./versions.json");
            if (manifest.version !== tag || pkg.version !== tag) throw new Error(`Tag ${tag} does not match manifest ${manifest.version} / package ${pkg.version}`);
            if (versions[tag] !== manifest.minAppVersion) throw new Error(`versions.json is missing ${tag} -> ${manifest.minAppVersion}`);
          ' "$tag"
      - run: npm run check
      - run: npm run package:release
      - run: npm run privacy:check
      - name: Zip example skills
        run: cd release/skills && zip -r ../../paperdian-skills.zip .
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." \
            release/paperdian/main.js \
            release/paperdian/manifest.json \
            release/paperdian/styles.css \
            paperdian-skills.zip
